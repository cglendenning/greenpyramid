org.gradle.jvmargs=-Xmx4g
# Keep Gradle warm and reuse work between Flutter invocations.
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
# Avoid spawning more compiler workers than this laptop can service efficiently.
org.gradle.workers.max=4
# Make Kotlin compilation incremental and keep the compiler in the Gradle JVM.
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Suppress Java version warnings
systemProp.org.gradle.internal.publish.checksums.insecure=true
org.gradle.warning.mode=none
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
